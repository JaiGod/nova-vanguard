name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    # Skipped automatically until Unity license secrets are configured.
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [StandaloneWindows64, Android, WebGL]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: NovaVanguard
          buildsPath: Builds
          androidExportType: androidPackage
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: NovaVanguard-${{ matrix.targetPlatform }}
          path: Builds/${{ matrix.targetPlatform }}

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.UNITY_CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip artifacts
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
